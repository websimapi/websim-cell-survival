<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Survival: Evolve or Die</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: url('assets/petri-dish-background.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="stats-panel">
                <div id="player-size">Size: 10</div>
                <div id="player-rank">Rank: #1</div>
                <div id="player-score">Score: 0</div>
            </div>
            <div id="leaderboard" class="panel">
                <h3>Leaderboard</h3>
                <ul id="leaderboard-list"></ul>
            </div>
            <div id="game-over" class="hidden">
                <h2>Game Over</h2>
                <p>Your final score: <span id="final-score">0</span></p>
                <button id="play-again">Play Again</button>
            </div>
        </div>
    </div>
    <div id="start-screen">
        <h1>Cell Survival: Evolve or Die</h1>
        <div class="input-container">
            <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
            <button id="start-game">Play</button>
        </div>
    </div>
    <script type="module" src="./js/main.js"></script>

</body>
</html>
